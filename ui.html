const $=id=>document.getElementById(id);
const themeStorageKey='codex-kanban.theme.v1',themeModes=['system','light','dark'];

function applyTheme(){
  document.documentElement.dataset.theme=themePreference==='system'?(hostTheme??(themeMedia.matches?'dark':'light')):themePreference;
  $('theme').value=themePreference;
}
function restoreTheme(){
  try{const saved=localStorage.getItem(themeStorageKey);themePreference=themeModes.includes(saved)?saved:'system';}
  catch{themePreference='system';}
  applyTheme();
}
function setTheme(mode){
  themePreference=themeModes.includes(mode)?mode:'system';applyTheme();
  try{localStorage.setItem(themeStorageKey,themePreference);}
  catch{announce('Appearance changed, but could not be saved in this browser.');}
}
$('theme').onchange=()=>setTheme($('theme').value);
themeMedia.addEventListener?.('change',()=>{if(themePreference==='system')applyTheme();});
window.addEventListener('kanban-host-theme',e=>{
  if(e.detail==='light'||e.detail==='dark'){hostTheme=e.detail;if(themePreference==='system')applyTheme();}
});
restoreTheme();
let filter='all',view='board',selectedTask=null;
const collapsed=new Set();
const columnScroll=new Map();
const groupOrderStoragePrefix='codex-kanban.group-order.v1:',groupingMode='native';
let draggedGroup=null;
function currentGroups(){return nativeColumns();}
function readGroupOrder(mode){
  try{
    const saved=JSON.parse(localStorage.getItem(groupOrderStoragePrefix+mode)??'[]');
    return Array.isArray(saved)?[...new Set(saved.filter(id=>typeof id==='string').map(id=>mode==='native'&&id==='threads'?'chats':id))]:[];
  }catch{return [];}
}
function orderedGroups(groups,mode=groupingMode){
  const saved=readGroupOrder(mode),rank=new Map(saved.map((id,i)=>[id,i]));
  return [...groups].sort((a,b)=>(rank.get(a.id)??saved.length)-(rank.get(b.id)??saved.length));
}
function moveGroup(sourceId,targetId,after=false){
  const mode=groupingMode,groups=orderedGroups(currentGroups(),mode),ids=groups.map(g=>g.id);
  if(sourceId===targetId||!ids.includes(sourceId)||!ids.includes(targetId))return false;
  ids.splice(ids.indexOf(sourceId),1);ids.splice(ids.indexOf(targetId)+(after?1:0),0,sourceId);
  try{localStorage.setItem(groupOrderStoragePrefix+mode,JSON.stringify(ids));}
  catch{announce('Group order not saved: allow browser storage and try again.');return false;}
  render();announce('Group order saved in this browser');return true;
}
function clearGroupDropMarkers(){
  document.querySelectorAll('.group-drop-before,.group-drop-after').forEach(node=>node.classList.remove('group-drop-before','group-drop-after'));
}
function finishGroupDrag(){

  document.querySelectorAll('.group-dragging').forEach(node=>node.classList.remove('group-dragging'));clearGroupDropMarkers();
}
function enableGroupDrag(section,head,col){
  head.draggable=true;head.title='Drag to reorder · Alt + arrow keys to move · '+col.desc;
  head.addEventListener('dragstart',e=>{
    if(draggedKey){e.preventDefault();return;}
    e.stopPropagation();draggedGroup=col.id;++nativeEpoch;
    e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('application/x-codex-kanban-group',col.id);
    section.classList.add('group-dragging');
  });

  const dropAfter=e=>{const rect=(view==='list'?head:section).getBoundingClientRect();return view==='list'?e.clientY>rect.top+rect.height/2:e.clientX>rect.left+rect.width/2;};

  });

function expireRuntimeSnapshot(now=Date.now()){
  if(!DATA)return false;
  let changed=false;
  for(const task of DATA.tasks){
    if(!['desktopSnapshot','desktopRuntime'].includes(task.runtimeStatusSource)||task.runtimeStatusStale)continue;
    const capturedAt=task.runtimeStatusSource==='desktopRuntime'?task.runtimeCapturedAt:DATA.runtimeCapturedAt;
    const observed=Date.parse(capturedAt),age=now-observed;
    if(Number.isFinite(observed)&&age>=0&&age<=(DATA.runtimeSnapshotMaxAgeMs??15000))continue;
    task.lastObservedStatus??=task.rawStatus;task.lastObservedAt??=capturedAt;
    task.column='unknown';task.rawStatus='unknown';task.runtimeStatusStale=true;changed=true;
  }
  if(changed)DATA.runtimeSnapshotFresh=false;return changed;
}
function runtimeIsLive(task){return task.runtimeStatusSource==='desktopRuntime'&&!task.runtimeStatusStale;}
function runtimeLabel(task){
  if(task.runtimeStatusStale||task.runtimeStatusSource==='unavailable'||task.column==='unknown')return null;
  const name=columns.find(c=>c.id===task.column)?.name??'Unknown status';
  return runtimeIsLive(task)?name:name+' (snapshot)';
}
function updateRuntimeDetail(task){
  const col=columns.find(c=>c.id===task.column),label=runtimeLabel(task);
  $('detail-status').hidden=!label;
  $('detail-status').className='detail-status '+col.id+(runtimeIsLive(task)?'':' snapshot-runtime');
  $('detail-status').style.setProperty('--color',col.color);
  $('detail-status').replaceChildren(...(label?[el('span','state-ring'),el('span','',label)]:[]));
  $('detail-raw').textContent=JSON.stringify(!runtimeIsLive(task)?{
    currentStatus:runtimeLabel(task),lastObservedStatus:task.lastObservedStatus??null,lastObservedAt:task.lastObservedAt??null
  }:task.rawStatus??null,null,2);
}
let draggedKey=null,draggedTaskGroup=null,suppressClickUntil=0,toastTimer;
let nativeConnected=false,nativeWritable=false,nativeToken='',nativeEpoch=0,nativePending=false,nativeReads=0;
let archivingKey=null;
let pinningKey=null,restoringToken=null;
const archiveNotices=new Map();
const dismissedArchiveTokens=new Set();
function syncArchiveNotices(entries){
  if(!Array.isArray(entries))return;
  const known=new Set(entries.map(entry=>entry.undoToken));
  for(const token of archiveNotices.keys())if(!known.has(token))archiveNotices.delete(token);
  for(const {undoToken,task} of entries){
    if(typeof undoToken!=='string'||!task?.id||dismissedArchiveTokens.has(undoToken)||archiveNotices.has(undoToken))continue;
    archiveNotices.set(undoToken,{task,error:null});
  }
  renderArchiveNotices();
}
function taskActionPending(){return nativePending||archivingKey||pinningKey||restoringToken;}
function canArchive(task){return nativeConnected&&DATA.sync?.archiveLocal===true&&!!nativeToken&&!!taskUrl(task);}
function taskPinned(task){return task.nativeTaskPinned??task.pinned;}
function canPin(task){return nativeConnected&&DATA.sync?.pinLocal===true&&!!nativeToken&&!!taskUrl(task)
  &&DATA.sections.filter(s=>s.name==='Pinned').length===1;}
function projectDisabledReason(task){
  if(task.hostId!=='local')return 'Project changes are available for local tasks only.';
  if(!nativeConnected||!nativeToken)return 'Connect to the local service to change projects.';
  if(DATA.sync?.projectLocal!==true)return 'The local project directory is unavailable. Refresh and try again.';
  if(!taskUrl(task))return 'This task cannot change projects from the board.';
  if(taskActionPending())return 'Another task action is in progress.';
  return '';
}
function updateProjectPicker(task){
  const select=$('detail-project'),projects=(DATA.projects??[]).filter(p=>p.hostId==='local');
  const current=task.localProjectId??(task.projectId?projects.find(p=>p.desktopProjectId===task.projectId)?.projectId:null)??'';
  const removal=task.projectName?'Remove from '+task.projectName:'No project';
  const choices=[{value:'',name:removal},...projects.map(p=>({value:p.projectId,name:p.label}))];
  if(!choices.some(p=>p.value===current))choices.unshift({value:current,name:task.projectName||'Select project…',disabled:true});
  const signature=JSON.stringify(choices);
  if(select.dataset.choices!==signature){select.replaceChildren();for(const choice of choices){const option=el('option','',choice.name);option.value=choice.value;option.disabled=!!choice.disabled;select.append(option);}select.dataset.choices=signature;}
  select.value=current;const reason=projectDisabledReason(task);select.disabled=!!reason;
  select.title=reason||'Save this task to a project. The working directory stays unchanged.';
  $('project-edit-hint').textContent=reason;$('project-edit-hint').hidden=!reason;
}
let taskMenu=null,submenuCloseTimer;
function cancelSubmenuClose(){clearTimeout(submenuCloseTimer);}

  cancelSubmenuClose();$('task-submenu').hidden=true;
  if(taskMenu?.submenu){const anchor=taskMenu.submenu.anchor;anchor.setAttribute('aria-expanded','false');taskMenu.submenu=null;if(restoreFocus)anchor.focus();}
}
function scheduleSubmenuClose(){cancelSubmenuClose();submenuCloseTimer=setTimeout(()=>closeTaskSubmenu(),150);}
function closeTaskMenu(restoreFocus=false){
  closeTaskSubmenu();

  if(previous){previous.anchor.setAttribute('aria-expanded','false');if(restoreFocus)previous.anchor.focus();}
}
function openTaskMenu(task,anchor,page='actions'){
  if(taskActionPending())return;
  if(taskMenu?.anchor===anchor&&taskMenu.page===page){closeTaskMenu(true);return;}
  closeTaskMenu();taskMenu={task,anchor,page};anchor.setAttribute('aria-expanded','true');renderTaskMenu();
}
function renderTaskMenu(){
  if(!taskMenu)return;
  const {task,page}=taskMenu,panel=$('task-menu');panel.replaceChildren();panel.hidden=false;
  panel.setAttribute('aria-label',(page==='actions'?'Task actions':page==='project'?'Choose project':'Choose section')+': '+task.title);
  const item=(container,label,name,action,{disabled=false,reason='',checked,submenu=false}={})=>{
    const button=el('button','task-menu-item');button.type='button';button.draggable=false;button.tabIndex=-1;
    button.append(icon(name),el('span','menu-label',label));button.disabled=disabled;button.title=reason||label;
    button.setAttribute('role',checked===undefined?'menuitem':'menuitemradio');
    if(checked!==undefined)button.setAttribute('aria-checked',String(checked));
    if(checked)button.append(icon('check'));
    if(submenu){button.setAttribute('aria-haspopup','menu');button.setAttribute('aria-expanded','false');button.setAttribute('aria-controls','task-submenu');button.append(icon('chevron'));}
    button.onclick=e=>{e.stopPropagation();if(!button.disabled)action(button);};container.append(button);return button;
  };
  const mainItem=(...args)=>item(panel,...args);
  const run=action=>{closeTaskMenu();action();};
  const showPage=next=>{taskMenu.page=next;renderTaskMenu();};
  const separator=()=>panel.append(el('div','task-menu-separator'));
  const choices=(container,choicePage)=>{
    if(choicePage==='project'){
      const projects=(DATA.projects??[]).filter(p=>p.hostId==='local');
      const current=task.localProjectId??(task.projectId?projects.find(p=>p.desktopProjectId===task.projectId)?.projectId:null);
      for(const project of projects)item(container,project.label,'folder',()=>run(()=>setTaskProject(task,project.projectId)),{checked:project.projectId===current});
      if(task.localProjectId||task.projectId){
        container.append(el('div','task-menu-separator'));
        item(container,'Remove from '+(task.projectName||projects.find(p=>p.projectId===current)?.label||'project'),'folder-remove',()=>run(()=>setTaskProject(task,null)));
      }else if(!projects.length)container.append(el('div','task-menu-heading','No projects available'));
    }else{
      const groups=nativeColumns(),current=nativeStage(task,groups);
      for(const group of groups.filter(g=>['For Later','In Progress','For Review','Pinned'].includes(g.name)||g.id==='chats'))
        item(container,group.name,'list',()=>run(()=>moveNative(task,group.id==='chats'?null:group.id)),{checked:group.id===current});
    }
  };
  const showSubmenu=(choicePage,anchor,focus=false)=>{
    cancelSubmenuClose();
    if(taskMenu?.submenu?.anchor!==anchor){
      closeTaskSubmenu();taskMenu.submenu={page:choicePage,anchor};anchor.setAttribute('aria-expanded','true');
      const child=$('task-submenu');child.replaceChildren();child.hidden=false;child.setAttribute('aria-label','Choose '+choicePage+': '+task.title);
      taskMenu.submenu.backButton=item(child,'Back','back',()=>closeTaskSubmenu(true));
      choices(child,choicePage);positionTaskSubmenu();
    }
    if(focus)[...$('task-submenu').querySelectorAll('.task-menu-item')].find(button=>!button.disabled&&!button.hidden)?.focus();
  };
  if(page==='actions'){
    if(canPin(task))mainItem(taskPinned(task)?'Unpin':'Pin','menu-pin',()=>run(()=>setTaskPinned(task)));
    const project=mainItem('Project','folder-move',button=>showSubmenu('project',button,true),{disabled:!!projectDisabledReason(task),reason:projectDisabledReason(task),submenu:true});
    const reason=nativeGroupDisabledReason(task);
    const section=mainItem('Section','list',button=>showSubmenu('section',button,true),{disabled:!!reason,reason,submenu:true});
    for(const [button,choicePage]of [[project,'project'],[section,'section']])button.onmouseenter=()=>{if(!button.disabled)showSubmenu(choicePage,button);};
    separator();mainItem('View details','sidebar',()=>run(()=>showDetail(task)));
    if(canArchive(task)){separator();mainItem('Archive','archive',()=>run(()=>archiveTask(task)));}
    for(const button of panel.querySelectorAll('.task-menu-item'))if(button.getAttribute('aria-haspopup')!=='menu')button.onmouseenter=()=>closeTaskSubmenu();
  }else{
    mainItem('Back','back',()=>showPage('actions'));separator();panel.append(el('div','task-menu-heading',page==='project'?'Project':'Section'));choices(panel,page);
  }
  positionTaskMenu();
  [...panel.querySelectorAll('.task-menu-item')].find(button=>!button.disabled)?.focus();
}
function positionTaskMenu(){
  if(!taskMenu)return;
  const panel=$('task-menu'),rect=taskMenu.anchor.getBoundingClientRect(),size=panel.getBoundingClientRect(),width=window.innerWidth??1024,height=window.innerHeight??768;
  panel.style.left=Math.max(12,Math.min(rect.right-size.width,width-size.width-12))+'px';
  panel.style.top=Math.max(12,Math.min(rect.bottom+6+size.height<=height-12?rect.bottom+6:rect.top-size.height-6,height-size.height-12))+'px';
  positionTaskSubmenu();

function positionTaskSubmenu(){
  if(!taskMenu?.submenu)return;
  taskMenu.submenu.backButton.hidden=(window.innerWidth??1024)>=500;
  const panel=$('task-submenu'),parent=$('task-menu').getBoundingClientRect(),anchor=taskMenu.submenu.anchor.getBoundingClientRect(),size=panel.getBoundingClientRect(),width=window.innerWidth??1024,height=window.innerHeight??768;
  const left=parent.right+size.width<=width-12?parent.right:parent.left-size.width;
  panel.style.left=Math.max(12,Math.min(left,width-size.width-12))+'px';
  panel.style.top=Math.max(12,Math.min(anchor.top-5,height-size.height-12))+'px';

for(const id of ['task-menu','task-submenu']){$(id).onmouseenter=cancelSubmenuClose;$(id).onmouseleave=scheduleSubmenuClose;}
function renderArchiveNotices(){
  const root=$('archive-notices');root.replaceChildren();
  for(const [token,notice]of archiveNotices){
    const row=el('div','archive-notice'),copy=el('div','archive-notice-copy');
    const title=el('div','archive-notice-title',notice.task.title);title.title=notice.task.title;
    copy.append(title,el('small','','Task archived'));
    if(notice.error)copy.append(el('small','undo-error',notice.error));
    const undo=el('button','undo-button',restoringToken===token?'Restoring…':'Undo');undo.type='button';
    undo.setAttribute('aria-label','Undo archive: '+notice.task.title);undo.disabled=!!taskActionPending();undo.onclick=()=>undoArchive(token);
    const dismiss=el('button','notice-dismiss');dismiss.type='button';dismiss.append(icon('close'));
    dismiss.setAttribute('aria-label','Dismiss archive notice: '+notice.task.title);dismiss.title='Dismiss';dismiss.disabled=restoringToken===token;
    dismiss.onclick=()=>{dismissedArchiveTokens.add(token);archiveNotices.delete(token);renderArchiveNotices();};
    row.append(copy,undo,dismiss);root.append(row);
  }
}
async function undoArchive(token){
  const notice=archiveNotices.get(token);if(!notice||taskActionPending())return;
  restoringToken=token;++nativeEpoch;render();renderArchiveNotices();
  try{
    const response=await fetch('/api/unarchive',{method:'POST',headers:{'Content-Type':'application/json','X-Kanban-Token':nativeToken},body:JSON.stringify({undoToken:token})});
    const payload=await response.json();
    if(!response.ok||payload.restored!==true||payload.threadId!==notice.task.id)throw Error(payload.error||'Restore could not be confirmed.');
    restoringToken=null;
    if(payload.board)applyNativeBoard(payload.board);
    else{if(!DATA.tasks.some(t=>taskKey(t)===taskKey(notice.task)))DATA={...DATA,tasks:[...DATA.tasks,notice.task]};refreshSummary();render({animate:true});}
    archiveNotices.delete(token);renderArchiveNotices();announce('Archive undone');
  }catch(error){restoringToken=null;notice.error=error.message;render();renderArchiveNotices();await refreshNativeBoard(true);}
}
async function setTaskPinned(task){
  if(!canPin(task)||taskActionPending())return;
  pinningKey=taskKey(task);++nativeEpoch;render();renderArchiveNotices();
  try{
    const response=await fetch('/api/pin',{method:'POST',headers:{'Content-Type':'application/json','X-Kanban-Token':nativeToken},body:JSON.stringify({threadId:task.id,hostId:task.hostId,pinned:!taskPinned(task)})});
    const payload=await response.json();
    if(!response.ok||payload.threadId!==task.id||payload.pinned!==!taskPinned(task))throw Error(payload.error||'Pin change could not be confirmed.');
    pinningKey=null;
    if(payload.board)applyNativeBoard(payload.board);else await refreshNativeBoard(true);
    announce(payload.pinned?'Task pinned':'Task unpinned');
  }catch(error){pinningKey=null;render();await refreshNativeBoard(true);announce(error.message);}
  finally{renderArchiveNotices();}
}
async function archiveTask(task){
  if(!canArchive(task)||taskActionPending())return;
  archivingKey=taskKey(task);++nativeEpoch;render();renderArchiveNotices();
  try{
    const response=await fetch('/api/archive',{method:'POST',headers:{'Content-Type':'application/json','X-Kanban-Token':nativeToken},
      body:JSON.stringify({threadId:task.id,hostId:task.hostId})});
    const payload=await response.json();
    if(!response.ok||payload.archived!==true||payload.threadId!==task.id)throw Error(payload.error||'Archive could not be confirmed.');
    archivingKey=null;
    // Keep the recovery action even if the subsequent board rendering fails.
    if(typeof payload.undoToken==='string')archiveNotices.set(payload.undoToken,{task,error:null});
    renderArchiveNotices();
    if(selectedTask&&taskKey(selectedTask)===taskKey(task)){$('detail').close();selectedTask=null;}
    if(payload.board)applyNativeBoard(payload.board);
    else{DATA={...DATA,tasks:DATA.tasks.filter(t=>taskKey(t)!==taskKey(task))};refreshSummary();render({animate:true});}
    if(typeof payload.undoToken!=='string')announce('Task archived');
    renderArchiveNotices();
  }catch(error){archivingKey=null;render();renderArchiveNotices();await refreshNativeBoard(true);announce(error.message);}
}
let nativeMessage='Sidebar snapshot · Live bridge disconnected · Read only';
function nativeCanEditGroup(task){return nativeConnected&&nativeWritable&&!!nativeToken&&!taskActionPending()&&!task.sidebarOnly&&task.hostId==='local'
  &&nativeEditablePlacement(task)&&(task.nativeMembershipCount??0)<=1;}
function nativeEditablePlacement(task){return ['localThreadSection','localDefault'].includes(task.placementSource)
  ||task.placementSource==='desktopProject'&&task.localSectionId===null&&typeof task.projectId==='string'&&task.projectId.length>0;}
function nativeGroupDisabledReason(task){
  if(taskActionPending())return nativePending?'Saving group and verifying…':'Another task action is in progress. Wait for it to finish.';
  if(!nativeConnected||!nativeToken)return 'Local connection required to change groups.';
  if(!nativeWritable)return DATA?.sync?.scope==='localSections'?nativeMessage:'The local connection is read only. Manage groups in Codex.';
  if(task.hostId!=='local')return 'Group editing is available for local tasks only. Manage this task in Codex.';
  if(task.sidebarOnly)return 'This task’s details could not be verified. Manage its group in Codex.';
  if(task.placementSource==='desktopProject'&&!nativeEditablePlacement(task))return task.projectName?
    `Inherited from project “${task.projectName}”. Manage the project’s group in Codex.`:
    'Inherited from its project. Manage the project’s group in Codex.';
  if(!nativeEditablePlacement(task))return 'This task’s group could not be verified. Manage it in Codex.';
  if(!((task.nativeMembershipCount??0)<=1))return 'Group membership is ambiguous. Refresh before changing groups.';
  return '';
}
function nativeCanMove(task){return nativeCanEditGroup(task);}
function nativeColumns(){
  const colors={'For Later':'var(--state-later)','In Progress':'var(--state-progress)','For Review':'var(--state-review)','Tasks':'var(--state-neutral)','Pinned':'var(--state-pinned)'};
  const groups=[];
  for(const section of DATA?.sections??[]){

  const viewport=$('board').parentElement.getBoundingClientRect();
  const visible=rect=>rect.right>viewport.left&&rect.left<viewport.right&&rect.bottom>viewport.top&&rect.top<viewport.bottom;
  for(const node of $('board').querySelectorAll('.card,.col-head')){
    const rect=node.getBoundingClientRect();
    if(!rect.width||!rect.height)continue;
    const card=!!node.dataset.taskKey,key=card?'task:'+node.dataset.taskKey:'group:'+node.dataset.groupKey,previous=before.get(key);
    if(!visible(rect)&&(!previous||!visible(previous.rect)))continue;
    if(previous){
      const dx=previous.rect.left-rect.left,dy=previous.rect.top-rect.top;
      if(Math.abs(dx)>1||Math.abs(dy)>1)animateRefreshNode(node,[{transform:`translate(${dx}px,${dy}px)`},{transform:'translate(0,0)'}]);
      const unread=node.querySelector('.unread');
      if(card&&unread&&!previous.unread)animateRefreshNode(unread,[{opacity:0},{opacity:1}],180);
    }else if(card)animateRefreshNode(node,[{opacity:0},{opacity:1}],180);
  }
}

  if(scroll){wrap.scrollLeft=scroll.left;wrap.scrollTop=scroll.top;}
  if(!matchMedia('(prefers-reduced-motion: reduce)').matches){

      if(!ring.getClientRects().length)continue;

  }

    const latest=DATA.tasks.find(t=>taskKey(t)===taskKey(selectedTask));
    if(latest){selectedTask=latest;updateDetailProperties(latest);}
    else{const message='This task is no longer in the current board data. Refresh to check again.';$('detail-native').disabled=true;$('detail-native').title=message;$('native-edit-hint').textContent=message;$('native-edit-hint').hidden=false;$('detail-project').disabled=true;$('project-edit-hint').textContent=message;$('project-edit-hint').hidden=false;}

async function setTaskProject(task,projectId){
  if(!task||projectDisabledReason(task)||(projectId!==null&&!projectId))return;
  nativePending=true;++nativeEpoch;render();renderArchiveNotices();
  let message=projectId===null?'Project removed and verified.':'Project saved and verified.';

    const response=await fetch('/api/project',{method:'POST',headers:{'Content-Type':'application/json','X-Kanban-Token':nativeToken},body:JSON.stringify({threadId:task.id,hostId:task.hostId,projectId,expectedProjectId:task.localProjectId??null})});
    const payload=await response.json();
    if(!response.ok||payload.threadId!==task.id||payload.projectId!==projectId||typeof payload.changed!=='boolean')throw Error(payload.error||'Project change could not be confirmed.');
    nativeToken=payload.csrf??nativeToken;
    if(payload.board)applyNativeBoard(payload.board);
    else message='Project saved; refresh to read the updated board.';
  }catch(error){message=error.message;}
  finally{nativePending=false;await refreshNativeBoard(true);render();renderArchiveNotices();}
  announce(message);
  if(selectedTask&&taskKey(selectedTask)===taskKey(task)){$('project-edit-hint').textContent=message;$('project-edit-hint').hidden=false;}
}
