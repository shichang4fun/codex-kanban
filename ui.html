<script>
let DATA = /*__BOARD_DATA__*/null;
const columns=[
  {id:'running',name:'Running',color:'var(--state-progress)',desc:'Executing',empty:'No running tasks in this snapshot'},
  {id:'attention',name:'Needs attention',color:'var(--state-later)',desc:'Needs your input',empty:'No tasks waiting for input in this snapshot'},
  {id:'idle',name:'Idle',color:'var(--state-neutral)',desc:'No active turn',empty:'No idle tasks in this snapshot'},
  {id:'unloaded',name:'Not loaded',color:'var(--state-muted)',desc:'Not loaded in the runtime',empty:'No unloaded tasks in this snapshot'},
  {id:'error',name:'Error',color:'var(--state-error)',desc:'System error',empty:'No errors in this snapshot'},
  {id:'unknown',name:'Unknown status',color:'var(--state-muted)',desc:'No runtime evidence',empty:'No tasks with unknown status'}
];
const $=id=>document.getElementById(id);
let filter='all',view='board',selectedTask=null;
const collapsed=new Set();
const groupOrderStoragePrefix='codex-kanban.group-order.v1:',groupingMode='native';
let draggedGroup=null;
function currentGroups(){return nativeColumns();}
function readGroupOrder(mode){
  try{
    const saved=JSON.parse(localStorage.getItem(groupOrderStoragePrefix+mode)??'[]');
    return Array.isArray(saved)?[...new Set(saved.filter(id=>typeof id==='string').map(id=>mode==='native'&&id==='threads'?'chats':id))]:[];
  }catch{return [];}
}
function orderedGroups(groups,mode=groupingMode){
  const saved=readGroupOrder(mode),rank=new Map(saved.map((id,i)=>[id,i]));
  return [...groups].sort((a,b)=>(rank.get(a.id)??saved.length)-(rank.get(b.id)??saved.length));
}
function moveGroup(sourceId,targetId,after=false){
  const mode=groupingMode,groups=orderedGroups(currentGroups(),mode),ids=groups.map(g=>g.id);
  if(sourceId===targetId||!ids.includes(sourceId)||!ids.includes(targetId))return false;
  ids.splice(ids.indexOf(sourceId),1);ids.splice(ids.indexOf(targetId)+(after?1:0),0,sourceId);
  try{localStorage.setItem(groupOrderStoragePrefix+mode,JSON.stringify(ids));}
  catch{announce('Group order not saved: allow browser storage and try again.');return false;}
  render();announce('Group order saved in this browser');return true;
}
function clearGroupDropMarkers(){
  document.querySelectorAll('.group-drop-before,.group-drop-after').forEach(node=>node.classList.remove('group-drop-before','group-drop-after'));
}
function finishGroupDrag(){
  draggedGroup=null;suppressClickUntil=performance.now()+300;
  document.querySelectorAll('.group-dragging').forEach(node=>node.classList.remove('group-dragging'));clearGroupDropMarkers();
}
function enableGroupDrag(section,head,col){
  head.draggable=true;head.title='Drag to reorder · Alt + arrow keys to move · '+col.desc;
  head.addEventListener('dragstart',e=>{
    if(draggedKey){e.preventDefault();return;}
    e.stopPropagation();draggedGroup=col.id;++nativeEpoch;
    e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('application/x-codex-kanban-group',col.id);
    section.classList.add('group-dragging');
  });
  head.addEventListener('dragend',finishGroupDrag);
  const dropAfter=e=>{const rect=(view==='list'?head:section).getBoundingClientRect();return view==='list'?e.clientY>rect.top+rect.height/2:e.clientX>rect.left+rect.width/2;};
  section.addEventListener('dragover',e=>{
    if(!draggedGroup)return;e.preventDefault();e.stopImmediatePropagation();e.dataTransfer.dropEffect='move';clearGroupDropMarkers();
    if(draggedGroup!==col.id)section.classList.add(dropAfter(e)?'group-drop-after':'group-drop-before');
  });
  section.addEventListener('dragleave',e=>{if(draggedGroup&&!section.contains(e.relatedTarget))clearGroupDropMarkers();});
  section.addEventListener('drop',e=>{
    if(!draggedGroup)return;e.preventDefault();e.stopImmediatePropagation();
    const source=draggedGroup,after=dropAfter(e);finishGroupDrag();moveGroup(source,col.id,after);
  });
  head.addEventListener('keydown',e=>{
    if(!e.altKey||!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key))return;
    e.preventDefault();const groups=orderedGroups(currentGroups()),index=groups.findIndex(g=>g.id===col.id),forward=['ArrowRight','ArrowDown'].includes(e.key),target=groups[index+(forward?1:-1)];
    if(target&&moveGroup(col.id,target.id,forward))document.querySelectorAll('.column').forEach(node=>{if(node.dataset.groupId===col.id)node.querySelector('.col-head').focus();});
  });
}
function expireRuntimeSnapshot(now=Date.now()){
  if(!DATA||DATA.sync?.runtimeLive!==false)return false;
  const observed=Date.parse(DATA.runtimeCapturedAt),age=now-observed;
  if(Number.isFinite(observed)&&age>=0&&age<=(DATA.runtimeSnapshotMaxAgeMs??15000))return false;
  let changed=false;
  for(const task of DATA.tasks){
    if(task.runtimeStatusSource!=='desktopSnapshot'||task.runtimeStatusStale)continue;
    task.lastObservedStatus??=task.rawStatus;task.lastObservedAt??=DATA.runtimeCapturedAt;
    task.column='unknown';task.rawStatus='unknown';task.runtimeStatusStale=true;changed=true;
  }
  DATA.runtimeSnapshotFresh=false;return changed;
}
function runtimeLabel(task){
  if(task.runtimeStatusStale||task.runtimeStatusSource==='unavailable'||task.column==='unknown')return null;
  const name=columns.find(c=>c.id===task.column)?.name??'Unknown status';
  return DATA.sync?.runtimeLive===false?name+' (snapshot)':name;
}
function updateRuntimeDetail(task){
  const col=columns.find(c=>c.id===task.column),label=runtimeLabel(task);
  $('detail-status').hidden=!label;
  $('detail-status').className='detail-status '+col.id+(DATA.sync?.runtimeLive===false?' snapshot-runtime':'');
  $('detail-status').style.setProperty('--color',col.color);
  $('detail-status').replaceChildren(...(label?[el('span','state-ring'),el('span','',label)]:[]));
  $('detail-raw').textContent=JSON.stringify(DATA.sync?.runtimeLive===false?{
    currentStatus:runtimeLabel(task),lastObservedStatus:task.lastObservedStatus??null,lastObservedAt:task.lastObservedAt??null
  }:task.rawStatus??null,null,2);
}
let draggedKey=null,draggedTaskGroup=null,suppressClickUntil=0,toastTimer;
let nativeConnected=false,nativeWritable=false,nativeToken='',nativeEpoch=0,nativePending=false,nativeReads=0;
let archivingKey=null;
let pinningKey=null,restoringToken=null;
const archiveNotices=new Map();
function taskActionPending(){return nativePending||archivingKey||pinningKey||restoringToken;}
function canArchive(task){return nativeConnected&&DATA.sync?.archiveLocal===true&&!!nativeToken&&!!taskUrl(task);}
function taskPinned(task){return task.nativeTaskPinned??task.pinned;}
function canPin(task){return nativeConnected&&DATA.sync?.pinLocal===true&&!!nativeToken&&!!taskUrl(task)
  &&DATA.sections.filter(s=>s.name==='Pinned').length===1;}
function renderArchiveNotices(){
  const root=$('archive-notices');root.replaceChildren();
  for(const [token,notice]of archiveNotices){
    const row=el('div','archive-notice'),copy=el('div','archive-notice-copy');
    const title=el('div','archive-notice-title',notice.task.title);title.title=notice.task.title;
    copy.append(title,el('small','','Task archived'));
    if(notice.error)copy.append(el('small','undo-error',notice.error));
    const undo=el('button','undo-button',restoringToken===token?'Restoring…':'Undo');undo.type='button';
    undo.setAttribute('aria-label','Undo archive: '+notice.task.title);undo.disabled=!!taskActionPending();undo.onclick=()=>undoArchive(token);
    const dismiss=el('button','notice-dismiss');dismiss.type='button';dismiss.append(icon('close'));
    dismiss.setAttribute('aria-label','Dismiss archive notice: '+notice.task.title);dismiss.title='Dismiss';dismiss.disabled=restoringToken===token;
    dismiss.onclick=()=>{archiveNotices.delete(token);renderArchiveNotices();};
    row.append(copy,undo,dismiss);root.append(row);
  }
}
async function undoArchive(token){
  const notice=archiveNotices.get(token);if(!notice||taskActionPending())return;
  restoringToken=token;++nativeEpoch;render();renderArchiveNotices();
  try{
    const response=await fetch('/api/unarchive',{method:'POST',headers:{'Content-Type':'application/json','X-Kanban-Token':nativeToken},body:JSON.stringify({undoToken:token})});
    const payload=await response.json();
    if(!response.ok||payload.restored!==true||payload.threadId!==notice.task.id)throw Error(payload.error||'Restore could not be confirmed.');
    restoringToken=null;
    if(payload.board)applyNativeBoard(payload.board);
    else{if(!DATA.tasks.some(t=>taskKey(t)===taskKey(notice.task)))DATA={...DATA,tasks:[...DATA.tasks,notice.task]};refreshSummary();render({animate:true});}
    archiveNotices.delete(token);renderArchiveNotices();announce('Archive undone');
  }catch(error){restoringToken=null;notice.error=error.message;render();renderArchiveNotices();await refreshNativeBoard(true);}
}
async function setTaskPinned(task){
  if(!canPin(task)||taskActionPending())return;
  pinningKey=taskKey(task);++nativeEpoch;render();renderArchiveNotices();
  try{
    const response=await fetch('/api/pin',{method:'POST',headers:{'Content-Type':'application/json','X-Kanban-Token':nativeToken},body:JSON.stringify({threadId:task.id,hostId:task.hostId,pinned:!taskPinned(task)})});
    const payload=await response.json();
    if(!response.ok||payload.threadId!==task.id||payload.pinned!==!taskPinned(task))throw Error(payload.error||'Pin change could not be confirmed.');
    pinningKey=null;
    if(payload.board)applyNativeBoard(payload.board);else await refreshNativeBoard(true);
    announce(payload.pinned?'Task pinned':'Task unpinned');
  }catch(error){pinningKey=null;render();await refreshNativeBoard(true);announce(error.message);}
  finally{renderArchiveNotices();}
}
async function archiveTask(task){
  if(!canArchive(task)||taskActionPending())return;
  archivingKey=taskKey(task);++nativeEpoch;render();renderArchiveNotices();
  try{
    const response=await fetch('/api/archive',{method:'POST',headers:{'Content-Type':'application/json','X-Kanban-Token':nativeToken},
      body:JSON.stringify({threadId:task.id,hostId:task.hostId})});
    const payload=await response.json();
    if(!response.ok||payload.archived!==true||payload.threadId!==task.id)throw Error(payload.error||'Archive could not be confirmed.');
    archivingKey=null;
    // Keep the recovery action even if the subsequent board rendering fails.
    if(typeof payload.undoToken==='string')archiveNotices.set(payload.undoToken,{task,error:null});
    renderArchiveNotices();
    if(selectedTask&&taskKey(selectedTask)===taskKey(task)){$('detail').close();selectedTask=null;}
    if(payload.board)applyNativeBoard(payload.board);
    else{DATA={...DATA,tasks:DATA.tasks.filter(t=>taskKey(t)!==taskKey(task))};refreshSummary();render({animate:true});}
    if(typeof payload.undoToken!=='string')announce('Task archived');
    renderArchiveNotices();
  }catch(error){archivingKey=null;render();renderArchiveNotices();await refreshNativeBoard(true);announce(error.message);}
}
let nativeMessage='Sidebar snapshot · Live bridge disconnected · Read only';
function nativeCanEditGroup(task){return nativeConnected&&nativeWritable&&!!nativeToken&&!taskActionPending()&&!task.sidebarOnly&&task.hostId==='local'
  &&['localThreadSection','localDefault'].includes(task.placementSource)&&(task.nativeMembershipCount??0)<=1;}
function nativeGroupDisabledReason(task){
  if(taskActionPending())return nativePending?'Saving group and verifying…':'Another task action is in progress. Wait for it to finish.';
  if(!nativeConnected||!nativeToken)return 'Local connection required to change groups.';
  if(!nativeWritable)return 'The local connection is read only. Manage groups in Codex.';
  if(task.hostId!=='local')return 'Group editing is available for local tasks only. Manage this task in Codex.';
  if(task.sidebarOnly)return 'This task’s details could not be verified. Manage its group in Codex.';
  if(task.placementSource==='desktopProject')return task.projectName?
    `Inherited from project “${task.projectName}”. Manage the project’s group in Codex.`:
    'Inherited from its project. Manage the project’s group in Codex.';
  if(!['localThreadSection','localDefault'].includes(task.placementSource))return 'This task’s group could not be verified. Manage it in Codex.';
  if(!((task.nativeMembershipCount??0)<=1))return 'Group membership is ambiguous. Refresh before changing groups.';
  return '';
}
function nativeCanMove(task){return nativeCanEditGroup(task);}
function nativeColumns(){
  const colors={'For Later':'var(--state-later)','In Progress':'var(--state-progress)','For Review':'var(--state-review)','Tasks':'var(--state-neutral)','Pinned':'var(--state-pinned)'};
  const groups=[];
  for(const section of DATA?.sections??[]){
    const ungrouped=['chats','threads'].includes(section.sectionId),id=ungrouped?'chats':section.sectionId;
    if(groups.some(g=>g.id===id)||!ungrouped&&!Object.hasOwn(colors,section.name)&&!DATA.tasks.some(t=>t.nativeSectionId===id))continue;
    groups.push({id,name:ungrouped?'Ungrouped':section.name,color:ungrouped?'var(--state-neutral)':colors[section.name]??'var(--state-muted)',
      desc:ungrouped?'No explicit group · Project labels are preserved':'Codex sidebar snapshot; counts reflect readable task cards',empty:ungrouped?'No ungrouped tasks':'No readable tasks in this group'});
  }
  const other=DATA?.tasks.some(t=>nativeStage(t,groups)==='__other');
  if(other)groups.push({id:'__other',name:'Unconfirmed group',color:'var(--state-muted)',desc:'No exact membership match',empty:'No unconfirmed tasks'});
  return groups;
}
function nativeStage(task,groups=nativeColumns()){
  const id=task.nativeSectionId==='threads'?'chats':task.nativeSectionId;
  return groups.some(g=>g.id===id)?id:'__other';
}
function nativeNotice(){
  const messages=[];
  if(!nativeConnected||!nativeWritable)messages.push(nativeMessage);
  if(DATA?.unavailableHosts?.length)messages.push('Some hosts unavailable; showing their latest snapshot.');
  $('native-note').hidden=!messages.length;$('native-note').textContent=messages.join(' · ');
  const format=value=>Number.isFinite(Date.parse(value))?new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Shanghai',dateStyle:'medium',timeStyle:'medium',hour12:false}).format(new Date(value)):'Unknown';
  $('refresh').title=['Refresh tasks',nativeConnected?'Groups auto-refresh every 5 seconds':'Showing saved groups',
    'Groups read: '+format(DATA?.capturedAt),'Runtime snapshot: '+format(DATA?.runtimeCapturedAt),DATA?.coverage].filter(Boolean).join('\n');
}
function refreshSummary(){
  if(!DATA)return;
  syncHostOptions();
  expireRuntimeSnapshot();
  for(const key of ['unread','pinned'])$('nav-'+key).textContent=DATA.tasks.filter(t=>key==='unread'?t.isUnread:t.pinned).length;
  $('nav-unread').closest('button').title=DATA.sync?.localUnreadConnected?'Local unread markers refresh every 5 seconds; other hosts use a desktop snapshot.':'Unread replies from the desktop snapshot.';
}
function syncHostOptions(){
  const select=$('host'),hosts=[...new Set(DATA.tasks.map(t=>t.hostId))].sort(),signature=JSON.stringify(hosts);
  if(select.dataset.hosts===signature)return;
  const selected=select.value;
  select.replaceChildren();
  for(const host of ['all',...hosts]){const option=el('option','',host==='all'?'All hosts':hostName(host));option.value=host;select.append(option);}
  select.value=hosts.includes(selected)?selected:'all';select.dataset.hosts=signature;
}
function applyNativeBoard(board){
  if(!Array.isArray(board?.tasks)||!Array.isArray(board.sections)||board.sync?.connected!==true)throw Error('Incomplete desktop response.');
  DATA=board;nativeConnected=true;nativeWritable=board.sync.writable===true;
  nativeMessage=board.sync.scope==='localSections'?(nativeWritable?'Drag between groups, including Pinned · Sidebar Flow continues automatic grouping':'Local groups connected · Refresh every 5 seconds'):nativeWritable?'Native groups connected · Changes verified after each move':'Native groups connected · Read only';
  expireRuntimeSnapshot();
  refreshSummary();render({animate:true});
}
async function refreshNativeBoard(force=false){
  if(location.protocol!=='http:'||taskActionPending()||(!force&&(nativePending||draggedKey||draggedGroup||document.hidden||nativeReads||document.activeElement?.closest('.card'))))return;
  nativeReads++;
  const epoch=++nativeEpoch;
  try{
    const response=await fetch('/api/board',{cache:'no-store'});
    if(!response.ok)throw Error('Local groups unavailable; keeping the latest snapshot.');
    const payload=await response.json();
    if(epoch!==nativeEpoch)return;
    if(!response.ok)throw Error(payload.error||'Desktop bridge unavailable.');
    nativeToken=payload.csrf;applyNativeBoard(payload.board);
  }catch(error){if(epoch!==nativeEpoch)return;nativeConnected=false;nativeWritable=false;nativeMessage=error.message;render();}

    const missing=(DATA.sidebarUnresolved??[]).filter(t=>nativeStage(t,groups)===col.id).length;if(missing){const gap=el('p','metadata-gap','Another '+missing+' member records could not be read and are excluded from task counts');gap.style.cssText='font-size:10px;color:var(--muted);margin:0 0 12px;line-height:1.7';section.append(gap);}
    const cards=el('div','cards');
    if(readProjectView(col.id)){
      for(const group of projectGroups(items)){
        const container=el('section','project-group');container.setAttribute('aria-label',group.name+' project tasks');
        const heading=el('h3','project-head');heading.title=group.name;
        heading.append(icon('folder'),el('span','project-name',group.name),el('span','project-count',String(group.items.length)));
        const children=el('div','project-cards');
        for(const task of group.items){const card=makeCard(task,progress,col.id);card.dataset.projectKey=group.key;children.append(card);}
        container.append(heading,children);cards.append(container);
      }
    }else for(const task of items)cards.append(makeCard(task,progress,col.id));
    if(!items.length){const empty=el('div','empty');empty.append(icon('inbox'),el('span','',filtering?'No matching tasks in this group':col.empty));if(!filtering)empty.append(el('small','',col.desc));cards.append(empty);}
    section.append(cards);$('board').append(section);
  }
  if(scroll){wrap.scrollLeft=scroll.left;wrap.scrollTop=scroll.top;}
  if(!matchMedia('(prefers-reduced-motion: reduce)').matches){
    for(const ring of $('board').querySelectorAll('.progress-ring')){
      if(!ring.getClientRects().length)continue;
      const animation=ring.animate([{transform:'rotate(0deg)'},{transform:'rotate(360deg)'}],{duration:2400,iterations:Infinity,easing:'linear'});
      // Anchor every replacement to the document clock so polling never resets its phase.
      animation.startTime=0;
    }
  }
  if(before)animateBoardRefresh(before);
  if(selectedTask&&$('detail').open){
    const latest=DATA.tasks.find(t=>taskKey(t)===taskKey(selectedTask));
    if(latest){selectedTask=latest;updateDetailProperties(latest);}
    else{const message='This task is no longer in the current board data. Refresh to check again.';$('detail-native').disabled=true;$('detail-native').title=message;$('native-edit-hint').textContent=message;$('native-edit-hint').hidden=false;}
  }
}
function setView(next){view=next;for(const mode of ['board','list'])$('view-'+mode).setAttribute('aria-pressed',String(mode===view));render();}
function setFilter(next){filter=next;for(const button of document.querySelectorAll('[data-filter]')){const selected=button.dataset.filter===filter;button.classList.toggle('selected',selected);button.setAttribute('aria-pressed',String(selected));if(selected)$('view-title').textContent=button.querySelector('.label').textContent;}render();}
function updateDetailProperties(task){
  $('detail-title').textContent=task.title;$('detail-summary').textContent=task.summary||'';$('detail-summary').hidden=!task.summary;$('detail-meta').replaceChildren();$('detail-tech-meta').replaceChildren();$('detail-git-meta').replaceChildren();
  updateRuntimeDetail(task);
  $('native-edit').hidden=false;
  const select=$('detail-native'),names=['For Later','In Progress','For Review','Pinned'],groups=nativeColumns(),stage=nativeStage(task,groups);
  const choices=groups.filter(s=>names.includes(s.name)||s.id==='chats'||s.id===stage)
    .map(s=>({value:s.id,name:s.name,disabled:!names.includes(s.name)&&s.id!=='chats'}));
  if(!choices.some(s=>s.value===stage))choices.unshift({value:stage,name:'Other group',disabled:true});
  const signature=JSON.stringify(choices);
  // Keep the focused select intact across polling when the group catalog is unchanged.
  if(select.dataset.choices!==signature){
    select.replaceChildren();for(const choice of choices){const option=el('option','',choice.name);option.value=choice.value;option.disabled=choice.disabled;select.append(option);}
    select.dataset.choices=signature;
  }
  select.value=stage;select.disabled=!nativeCanEditGroup(task);
  const disabledReason=nativeGroupDisabledReason(task);
  $('native-edit-hint').textContent=disabledReason;
  $('native-edit-hint').hidden=!$('native-edit-hint').textContent;
  select.title=disabledReason||'Changes are saved to Codex. Sidebar Flow continues automatic grouping; moving groups does not start or stop tasks.';
  for(const [name,value] of [['Host',hostName(task.hostId)],['Updated at',date(task.updatedAt)]])$('detail-meta').append(el('dt','',name),el('dd','',value));
  if(task.projectName)$('detail-meta').append(el('dt','','Project'),el('dd','',task.projectName));
  appendGitDetail(task);
  const source={task:'Task membership ID',project:'Parent project group',pinned:'Pinned task list',verifiedAlias:'Sidebar identity verified by task readback',unconfirmed:'No reliable match'};
  const placement={localThreadSection:'Local thread.section field',desktopProject:'Desktop project group (snapshot)',localDefault:'No local group; standalone task',desktopSnapshot:'Other hosts (desktop snapshot)'};
  for(const [name,value] of [['Working directory',task.cwd||'Standalone task'],['Task ID',task.id],['Host ID',task.hostId],['Grouping source',placement[task.placementSource]??source[task.nativeMembershipSource]??'Unknown']])$('detail-tech-meta').append(el('dt','',name),el('dd','',value));
}
function showDetail(task){
  selectedTask=task;updateDetailProperties(task);
  $('detail').querySelector('details').open=false;
  const url=taskUrl(task);$('open-task').hidden=!url;$('copy').hidden=!!url;if(url)$('open-task').href=url;else $('open-task').removeAttribute('href');
  $('detail-hint').hidden=!!url;$('detail-hint').textContent=url?'':'Direct navigation is unavailable. Copy the instruction and send it to Codex.';
  $('copy').textContent='Copy open instruction';$('open-prompt').style.display='none';$('detail').showModal();
}
$('search').addEventListener('input',render);$('host').onchange=render;$('order').onchange=changeSort;
async function changeDetailGroup(){
  const task=selectedTask,value=$('detail-native').value;
  if(!task)return;
  await moveNative(task,value==='chats'?null:value);
  const latest=DATA.tasks.find(t=>taskKey(t)===taskKey(task));
  if(selectedTask&&taskKey(selectedTask)===taskKey(task)&&latest){selectedTask=latest;updateDetailProperties(latest);$('native-edit-hint').textContent=$('task-toast').textContent;$('native-edit-hint').hidden=false;}
}
$('detail-native').onchange=changeDetailGroup;
window.addEventListener('storage',e=>{
  if(e.key===null){restoreSortPreference();projectViews.clear();}
  if(e.key?.startsWith(projectViewStoragePrefix)){projectViews.delete(e.key);if(!draggedGroup&&!draggedKey)render();return;}
  if(e.key===sortStorageKey){restoreSortPreference();if(!draggedGroup&&!draggedKey)render();return;}
  if(e.key?.startsWith(taskOrderStoragePrefix)){if(!draggedGroup&&!draggedKey)render({animate:true});return;}
  if(e.key?.startsWith(groupOrderStoragePrefix)){if(!draggedGroup&&!draggedKey)render();return;}
  if(e.key===null&&!draggedGroup&&!draggedKey)render();
});
for(const button of document.querySelectorAll('[data-filter]')){button.title=button.querySelector('.label').textContent;button.onclick=()=>setFilter(button.dataset.filter);}
$('view-board').onclick=()=>setView('board');$('view-list').onclick=()=>setView('list');
$('sidebar-toggle').onclick=()=>{const closed=$('shell').classList.toggle('sidebar-collapsed');$('sidebar-toggle').setAttribute('aria-expanded',String(!closed));$('sidebar-toggle').setAttribute('aria-label',closed?'Expand sidebar':'Collapse sidebar');};
$('close').onclick=()=>$('detail').close();
$('detail').onclick=e=>{if(e.target===$('detail')){const rect=$('detail').getBoundingClientRect();if(e.clientX<rect.left||e.clientX>rect.right||e.clientY<rect.top||e.clientY>rect.bottom)$('detail').close();}};
$('refresh').onclick=async()=>{if(taskActionPending()||nativeReads||draggedKey||draggedGroup)return;if(location.protocol!=='http:'){location.reload();return;}$('refresh').disabled=true;try{await refreshNativeBoard(true);}finally{$('refresh').disabled=false;}};
$('copy').onclick=async()=>{const prompt=`Please open the Codex chat “${selectedTask.title}”, threadId=${selectedTask.id}，hostId=${selectedTask.hostId}.`;try{await navigator.clipboard.writeText(prompt);$('copy').textContent='Copied';}catch{$('open-prompt').value=prompt;$('open-prompt').style.display='block';$('open-prompt').focus();$('open-prompt').select();$('copy').textContent='Copy the instruction below';}};
document.addEventListener('click',e=>{for(const menu of $('board').querySelectorAll('.card-menu'))if(!menu.contains(e.target))menu.open=false;});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){const menu=[...$('board').querySelectorAll('.card-menu')].find(menu=>menu.open);if(menu){menu.open=false;menu.querySelector('summary').focus();e.preventDefault();return;}}
  if($('detail').open||e.target.closest('input,textarea,select,[contenteditable=true]'))return;
  if(e.key==='/'&&!e.metaKey&&!e.ctrlKey&&!e.altKey){e.preventDefault();$('search').focus();}
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='b'){e.preventDefault();setView(view==='board'?'list':'board');}
});
restoreSortPreference();
if(!DATA){nativeMessage='No snapshot generated. Run build.mjs first.';nativeNotice();}
else{
  refreshSummary();
  render();
}
refreshNativeBoard();
setInterval(()=>{
  if(!draggedKey&&!draggedGroup){
    const runtimeChanged=expireRuntimeSnapshot(),gitChanged=expireGitSnapshots();
    if(runtimeChanged||gitChanged){refreshSummary();render();if(selectedTask&&$('detail').open)updateRuntimeDetail(selectedTask);}
  }
  refreshNativeBoard();
},5000);
</script>
</html>
